<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cold open</title>
    <link rel="stylesheet" href="card.css" />
    <style>
      .wrap {
        display: grid;
        grid-template-columns: 560px 1fr;
        gap: 70px;
        height: 100%;
        padding: 70px 100px;
        align-items: center;
      }
      .phone {
        height: 640px;
        border-radius: 46px;
        border: 3px solid var(--ink);
        background: #fff;
        padding: 34px 26px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        box-shadow: 0 18px 0 rgba(42, 31, 23, 0.08);
      }
      .bar {
        font-size: 17px;
        color: var(--ink-soft);
        text-align: center;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--paper-3);
      }
      .b {
        max-width: 82%;
        padding: 14px 18px;
        border-radius: 22px;
        font-size: 25px;
        line-height: 1.25;
      }
      .them {
        align-self: flex-start;
        background: var(--paper-2);
        border-bottom-left-radius: 6px;
      }
      .me {
        align-self: flex-end;
        background: var(--spring-mist);
        border-bottom-right-radius: 6px;
      }
      .scam {
        background: var(--danger-soft);
        border: 2px solid var(--danger);
        color: var(--danger);
        font-weight: 600;
      }
      .t {
        font-size: 15px;
        color: var(--ink-soft);
        text-align: center;
      }
      h1 {
        font-size: 74px;
        line-height: 1.04;
      }
      h1 span {
        color: var(--danger);
      }
      .sub {
        margin-top: 26px;
        font-size: 30px;
        color: var(--ink-soft);
        max-width: 620px;
        line-height: 1.3;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="phone">
        <div class="bar">Used bike, $95, pickup only</div>
        <div class="b them rise" style="animation-delay: 0.4s">Is this still available?</div>
        <div class="b me rise" style="animation-delay: 1.5s">Yes!</div>
        <div class="b them rise" style="animation-delay: 2.5s">Would you take $40?</div>
        <div class="t fade" style="animation-delay: 3.7s">6 days later</div>
        <div class="b me rise" style="animation-delay: 4.5s">I'm outside. Hello??</div>
        <div class="t fade" style="animation-delay: 5.6s">no reply</div>
        <div class="b them scam rise" style="animation-delay: 6.6s">Send a deposit first and I'll hold it for you</div>
      </div>
      <div>
        <h1 class="rise" style="animation-delay: 0.2s">Buying used, nearby, is <span>slow, risky and awkward.</span></h1>
        <p class="sub fade" style="animation-delay: 7.6s">Endless haggling. No-shows. Fake payment screenshots. "Send a deposit first."</p>
      </div>
    </div>
  </body>
</html>
