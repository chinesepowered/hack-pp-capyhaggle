<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thumbnail</title>
    <link rel="stylesheet" href="card.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 800px;
      }
      .wrap {
        height: 100%;
        padding: 44px 56px;
        display: flex;
        flex-direction: column;
        gap: 22px;
      }
      .scene {
        border-radius: 34px;
        overflow: hidden;
        border: 4px solid var(--ink);
        height: 470px;
        position: relative;
      }
      .scene img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
      }
      .held {
        position: absolute;
        right: 26px;
        top: 26px;
        background: #fff;
        border: 4px solid var(--pay);
        border-radius: 22px;
        padding: 12px 20px;
      }
      .held small {
        display: block;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 0.06em;
        color: var(--pay);
      }
      .held b {
        font-family: "Fredoka", sans-serif;
        font-size: 58px;
        line-height: 1;
      }
      h1 {
        font-size: 96px;
        line-height: 0.95;
      }
      h1 span {
        color: var(--spring-deep);
      }
      p {
        font-family: "Fredoka", sans-serif;
        font-size: 40px;
        font-weight: 500;
      }
      p b {
        color: var(--spring-deep);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="scene">
        <img src="../../public/mascots/nose-bump.svg" alt="" />
        <div class="held"><small>PAYMENT HELD BY PAYPAL</small><b>$82.00</b></div>
      </div>
      <h1>Capy <span>vs</span> Capy</h1>
      <p>Two capybaras haggle. <b>PayPal holds the money.</b></p>
    </div>
  </body>
</html>
